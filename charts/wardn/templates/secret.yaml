{{- if not .Values.existingSecret }}
{{- $fullName := include "wardn.fullname" . -}}
{{/*
Reuse previously generated values on upgrade so passwords/keys stay stable.
lookup returns nothing during `helm template`, which is fine for a dry run.
*/}}
{{- $prev := (lookup "v1" "Secret" .Release.Namespace $fullName) | default dict -}}
{{- $prevData := (get $prev "data") | default dict -}}
{{- $pgPass := .Values.postgres.auth.password -}}
{{- if not $pgPass -}}{{- $pgPass = (get $prevData "postgres-password" | b64dec) | default (randAlphaNum 24) -}}{{- end -}}
{{- $session := .Values.auth.sessionSecret -}}
{{- if not $session -}}{{- $session = (get $prevData "session-secret" | b64dec) | default (randAlphaNum 48) -}}{{- end -}}
{{- $secretKey := .Values.ai.secretKey -}}
{{- if not $secretKey -}}{{- $secretKey = (get $prevData "wardn-secret-key" | b64dec) | default (randAlphaNum 48) -}}{{- end -}}
{{- $dbUrl := "" -}}
{{- if .Values.postgres.enabled -}}
{{- $dbUrl = printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.auth.username $pgPass (include "wardn.postgres.fullname" .) .Values.postgres.auth.database -}}
{{- else -}}
{{- $dbUrl = required "postgres.enabled is false, so externalDatabase.url must be set" .Values.externalDatabase.url -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "wardn.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ $dbUrl | quote }}
  postgres-password: {{ $pgPass | quote }}
  session-secret: {{ $session | quote }}
  wardn-secret-key: {{ $secretKey | quote }}
  ai-api-key: {{ .Values.ai.apiKey | quote }}
  signoz-api-key: {{ .Values.signoz.apiKey | quote }}
  admin-password: {{ .Values.auth.adminPassword | quote }}
{{- end }}
