# nginx serves the built SPA and reverse-proxies /api to the backend Service.
# The upstream host `wardn-backend` matches the backend Service name in the Helm
# chart (see deploy/helm/wardn/templates/backend.yaml).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # API → backend service (in-cluster DNS)
    location /api/ {
        proxy_pass         http://wardn-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
