apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardn-backend
  labels:
    {{- include "wardn.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "wardn.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wardn-secrets
                  key: database-url
            - name: SEED_APP
              value: {{ .Values.app.name | quote }}
            - name: SEED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wardn-secrets
                  key: api-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  # Name is intentionally static: the frontend's nginx.conf proxies to
  # http://wardn-backend:8080, and the sample-app targets the same host.
  name: wardn-backend
  labels:
    {{- include "wardn.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
