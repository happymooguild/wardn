{{- if .Values.sampleApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardn-sample-app
  labels:
    {{- include "wardn.labels" . | nindent 4 }}
    app.kubernetes.io/component: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: sample-app
  template:
    metadata:
      labels:
        {{- include "wardn.labels" . | nindent 8 }}
        app.kubernetes.io/component: sample-app
    spec:
      containers:
        - name: sample-app
          image: {{ .Values.sampleApp.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: WARDN_URL
              value: "http://wardn-backend:{{ .Values.backend.port }}"
            - name: WARDN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wardn-secrets
                  key: api-key
            - name: APP_NAME
              value: {{ .Values.app.name | quote }}
            - name: APP_VERSION
              value: {{ .Values.sampleApp.version | quote }}
            - name: INTERVAL
              value: {{ .Values.sampleApp.interval | quote }}
            - name: BASE_LATENCY_MS
              value: {{ .Values.sampleApp.baseLatencyMs | quote }}
            - name: JITTER_MS
              value: {{ .Values.sampleApp.jitterMs | quote }}
            - name: REGRESSED
              value: {{ .Values.sampleApp.regressed | quote }}
            - name: REGRESSION_ADD_MS
              value: {{ .Values.sampleApp.regressionAddMs | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.sampleApp.otlpEndpoint | quote }}
{{- end }}
