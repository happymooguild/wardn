apiVersion: v1
kind: Secret
metadata:
  name: wardn-secrets
  labels:
    {{- include "wardn.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.password | quote }}
  # Full connection string so the backend doesn't have to assemble it.
  database-url: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@wardn-postgres:5432/{{ .Values.postgres.db }}?sslmode=disable"
  # "name:key,name:key" — what the backend seeds and the sample-apps authenticate with.
  seed-apps: "{{ range $i, $s := .Values.app.services }}{{ if $i }},{{ end }}{{ $s.name }}:{{ $s.apiKey }}{{ end }}"
  # One API key per service (referenced by each sample-app deployment).
  {{- range .Values.app.services }}
  api-key-{{ .name }}: {{ .apiKey | quote }}
  {{- end }}
  # AI provider credential + the key that encrypts UI-stored credentials.
  ai-api-key: {{ .Values.backend.aiApiKey | quote }}
  wardn-secret-key: {{ .Values.backend.secretKey | quote }}
