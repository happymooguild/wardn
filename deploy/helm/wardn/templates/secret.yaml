apiVersion: v1
kind: Secret
metadata:
  name: wardn-secrets
  labels:
    {{- include "wardn.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The per-app API key. The backend seeds it; the sample-app authenticates with it.
  api-key: {{ .Values.app.apiKey | quote }}
  postgres-password: {{ .Values.postgres.password | quote }}
  # Full connection string so the backend doesn't have to assemble it.
  database-url: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@wardn-postgres:5432/{{ .Values.postgres.db }}?sslmode=disable"
