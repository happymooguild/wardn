# Wires ArgoCD's notifications controller to POST a wardn deploy marker whenever
# the storefront Application syncs to Healthy. This is the GitOps caller from the
# design doc, running for real.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.wardn: |
    url: http://wardn-backend.default.svc.cluster.local:8080/api/v1/deployments
    headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer $wardn-api-key

  template.app-deployed-wardn: |
    webhook:
      wardn:
        method: POST
        body: |
          {
            "app": "{{.app.metadata.name}}",
            "version": "{{.app.status.sync.revision}}",
            "environment": "production",
            "timestamp": "{{.app.status.operationState.finishedAt}}",
            "source": "argocd"
          }

  # oncePer the git revision: one marker per deploy, even if health flaps.
  trigger.on-deployed: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      oncePer: app.status.sync.revision
      send: [app-deployed-wardn]

  subscriptions: |
    - recipients: [wardn]
      triggers: [on-deployed]
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  # Substituted into the Authorization header above. Must be the API key of the
  # wardn app whose name matches the Application (.app.metadata.name = storefront).
  wardn-api-key: wardn_dev_key_storefront
