kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: wardn
nodes:
  - role: control-plane
    # Map the frontend NodePort (30080) to localhost:8088 so the dashboard is
    # reachable from the host browser.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        protocol: TCP
