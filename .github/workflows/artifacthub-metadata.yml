# Push the Artifact Hub repository-metadata file to GHCR so Artifact Hub can
# verify ownership of the OCI chart repo (Verified Publisher badge).
#
# Runs automatically whenever artifacthub-repo.yml changes on main, and can be
# triggered by hand from the Actions tab (Run workflow). Uses the built-in
# GITHUB_TOKEN - no PAT and no local oras needed.

name: artifacthub-metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - artifacthub-repo.yml
      - .github/workflows/artifacthub-metadata.yml

permissions:
  contents: read
  packages: write

jobs:
  push-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Artifact Hub metadata
        run: |
          oras push \
            "ghcr.io/${{ github.repository_owner }}/charts/wardn:artifacthub.io" \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
