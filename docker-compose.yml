# Fast local loop WITHOUT Kubernetes. Same four components as the Helm chart,
# and service names match the in-cluster Service names (wardn-backend,
# wardn-postgres) so the frontend's nginx.conf works unchanged in both worlds.
#
#   docker compose up --build      # bring it all up
#   open http://localhost:8088     # the dashboard
#   docker compose down -v         # tear down + wipe the db volume
#
# Prefer the real thing? Use deploy/kind/setup.sh instead.

services:
  wardn-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardn
      POSTGRES_USER: wardn
      POSTGRES_PASSWORD: wardn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardn -d wardn"]
      interval: 3s
      timeout: 3s
      retries: 15

  wardn-backend:
    build: .
    environment:
      DATABASE_URL: postgres://wardn:wardn@wardn-postgres:5432/wardn?sslmode=disable
      # One entry per service: "name:apikey,name:apikey"
      SEED_APPS: "checkout-service:wardn_dev_key_checkout,payments-service:wardn_dev_key_payments"
      PUBLIC_BASE_URL: http://localhost:8088
      ALLOW_LOCAL_WEBHOOKS: "true"
      # Point at your SigNoz instance for the analyzer (optional).
      SIGNOZ_URL: ${SIGNOZ_URL:-}
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY:-}
      SIGNOZ_UI_URL: ${SIGNOZ_UI_URL:-}
      # Short windows so local demos finish quickly.
      # (per-app window_seconds defaults to 120 in DB; override via SQL if needed)
      ANALYZER_POLL_INTERVAL: 5s
      CLOCK_SKEW_MAX: 24h
      # AI root-cause analysis (optional). Either set a key here, or configure
      # one in the UI under AI Settings — WARDN_SECRET_KEY is what lets the UI
      # store it encrypted.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: 120s
      WARDN_SECRET_KEY: ${WARDN_SECRET_KEY:-dev-insecure-secret-key-change-me}
    ports:
      - "8080:8080"
    depends_on:
      wardn-postgres:
        condition: service_healthy

  wardn-frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - wardn-backend

  wardn-sample-app:
    build: ./demo/sample-app
    environment:
      WARDN_URL: http://wardn-backend:8080
      WARDN_API_KEY: wardn_dev_key_checkout
      APP_NAME: checkout-service
      APP_VERSION: v1.0.10
      INTERVAL: 3s
      BASE_LATENCY_MS: "60"
      JITTER_MS: "12"
      REGRESSED: "false"
      REGRESSION_ADD_MS: "140"
      # Optional: OTLP collector / SigNoz ingest endpoint (no trailing path).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      - wardn-backend

  # Second service — a distinct app the dashboard can switch to.
  wardn-sample-app-payments:
    build: ./demo/sample-app
    environment:
      WARDN_URL: http://wardn-backend:8080
      WARDN_API_KEY: wardn_dev_key_payments
      APP_NAME: payments-service
      APP_VERSION: v1.0.10
      INTERVAL: 3s
      BASE_LATENCY_MS: "95"
      JITTER_MS: "15"
      REGRESSED: "false"
      REGRESSION_ADD_MS: "180"
    depends_on:
      - wardn-backend
